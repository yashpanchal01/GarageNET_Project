{% extends 'base.html' %}

{% block title %}Login — GarageNET{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1" style="min-height: calc(100vh - 220px);">
  <div class="col-xl-4 col-lg-5 col-md-7 col-sm-9">
    
    <!-- Visual brand icon at top -->
    <div class="text-center mb-4">
      <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle shadow" style="width: 65px; height: 65px;">
        <i class="bi bi-tools fs-2"></i>
      </div>
      <h3 class="fw-bold mt-3 mb-1 text-dark">Welcome back</h3>
      <p class="text-muted small">Sign in to manage your workshop parts ledger</p>
    </div>

    <div class="card border-0 shadow p-4 rounded-4" style="background: #ffffff;">
      <div class="card-body p-2">
        {% if form.errors %}
          <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
          </div>
        {% endif %}
        
        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          
          <!-- Username input -->
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold mb-1">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control border-start-0 bg-white" placeholder="Enter username" required autofocus>
            </div>
          </div>
          
          <!-- Password input -->
          <div class="mb-4">
            <label class="form-label text-muted small fw-bold mb-1">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
              <input type="password" name="password" class="form-control border-start-0 bg-white" placeholder="Enter password" required>
            </div>
          </div>
          
          <button type="submit" class="btn btn-dark w-100 py-2.5 rounded-pill fw-semibold"><i class="bi bi-box-arrow-in-right me-1"></i>Log In</button>
        </form>
        
        <div class="text-center mt-4 pt-2 border-top">
          <span class="text-muted small">New workshop on the network?</span>
          <a href="{% url 'register' %}" class="fw-bold text-decoration-none small text-primary d-block mt-1">Create an account &rarr;</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
